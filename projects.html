<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CueMoo — Projects</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <a class="logo" href="index.html">CueMoo</a>

  <nav>
    <a href="index.html">About</a>
    <a class="active" href="projects.html">Projects</a>
    <a href="contact.html">Contact</a>
    <a href="stats.html">Stats</a>
  </nav>
</header>

<main>

  <section class="section-heading">

    <p class="eyebrow">PROJECTS</p>

    <h1>My projects.</h1>

    <p class="muted">
      Stuff I've made, worked on, or am currently working on.
    </p>

  </section>

  <!--
    ============================
    ADD / EDIT PROJECTS HERE
    ============================

    To add a project:
    1. Copy one of the project objects.
    2. Change the name.
    3. Change the description.
    4. Change the link.

    That's it.
  -->

  <section class="cards" id="projects"></section>

</main>

<footer>
  CueMoo
</footer>

<script>

const projects = [

  {
    name: "Games",
    description: "A collection of games and game projects.",
    link: "#"
  },

  {
    name: "Web Projects",
    description: "Websites, tools, and other things I'm building.",
    link: "#"
  },

  {
    name: "Experiments",
    description: "Random experiments, tests, and ideas.",
    link: "#"
  }

  /*
  ADD ANOTHER PROJECT LIKE THIS:

  ,
  {
    name: "My New Project",
    description: "What my project does.",
    link: "https://example.com"
  }

  */

];


const projectContainer = document.getElementById("projects");


projects.forEach((project, index) => {

  const card = document.createElement("article");

  card.className = "card";

  card.innerHTML = `

    <span class="number">
      ${String(index + 1).padStart(2, "0")}
    </span>

    <h2>${project.name}</h2>

    <p>
      ${project.description}
    </p>

    <a
      class="card-link"
      href="${project.link}"
    >
      View project →
    </a>

  `;

  projectContainer.appendChild(card);

});

</script>

</body>
</html>
