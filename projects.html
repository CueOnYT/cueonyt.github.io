<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CueMoo — Games</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

  <a
    class="logo"
    href="index.html"
  >
    CueMoo
  </a>

  <nav>

    <a href="index.html">
      About
    </a>

    <a
      class="active"
      href="projects.html"
    >
      Projects
    </a>

    <a href="contact.html">
      Contact
    </a>

  </nav>

</header>


<main>

  <section class="section-heading">

    <p class="eyebrow">
      GAME LIBRARY
    </p>

    <h1>
      Pick a game.
    </h1>

    <p class="muted">
      Small games, experiments, and things to play.
    </p>

  </section>


  <section
    class="cards"
    id="games"
  ></section>

</main>


<footer>
  CueMoo
</footer>


<script>

const games = [

  {
    name: "Blackjack",
    description: "Play classic blackjack against the dealer. Bet, hit, stand, or double down.",
    link: "games/blackjack.html"
  },

  {
    name: "Higher or Lower",
    description: "Guess whether the next card will be higher or lower.",
    link: "#"
  },

  {
    name: "Mines",
    description: "Choose your tiles, avoid the mines, and see how far you can go.",
    link: "#"
  },

  {
    name: "Coming Soon",
    description: "Another game is currently being built.",
    link: "#"
  }

];


const container =
  document.getElementById("games");


games.forEach(
  (game, index) => {

    const card =
      document.createElement("article");

    card.className = "card";


    const playable =
      game.link !== "#";


    card.innerHTML = `

      <span class="number">
        ${String(index + 1).padStart(2, "0")}
      </span>

      <h2>
        ${game.name}
      </h2>

      <p>
        ${game.description}
      </p>

      <a
        class="card-link"
        href="${game.link}"
        ${playable ? "" : 'aria-disabled="true"'}
      >
        ${playable ? "Play game →" : "Coming soon"}
      </a>

    `;


    if (!playable) {

      card.classList.add(
        "card-disabled"
      );

    }


    container.appendChild(card);

  }
);

</script>


</body>
</html>
```
