<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CueMoo — Projects</title>

  <!-- UMAMI ANALYTICS -->
  <script
    defer
    src="https://cloud.umami.is/script.js"
    data-website-id="f21ba53f-9919-4d9e-bebc-53fbb1c114e0">
  </script>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

  <a class="logo" href="index.html">
    CueMoo
  </a>

  <nav>

    <a href="index.html">
      About
    </a>

    <a class="active" href="projects.html">
      Projects
    </a>

    <a href="contact.html">
      Contact
    </a>

    <a href="stats.html">
      Stats
    </a>

  </nav>

</header>


<main>

  <section class="section-heading">

    <p class="eyebrow">
      PROJECTS
    </p>

    <h1>
      My projects.
    </h1>

    <p class="muted">
      Stuff I've made, worked on, or am currently working on.
    </p>

  </section>


  <!--
  ==================================================
  PROJECTS
  ==================================================

  ONLY EDIT THE SECTION BELOW.

  To add another project, copy one of these:

  {
    name: "Project Name",
    description: "Project description.",
    link: "https://example.com"
  }

  ==================================================
  -->

  <section
    class="cards"
    id="projects">
  </section>


</main>


<footer>
  CueMoo
</footer>


<script>

const projects = [

  {
    name: "Games",
    description: "A collection of games and game projects.",
    link: "#"
  },

  {
    name: "Web Projects",
    description: "Websites, tools, and other things I'm building.",
    link: "#"
  },

  {
    name: "Experiments",
    description: "Random experiments, tests, and ideas.",
    link: "#"
  }

  /*
  
  ADD MORE PROJECTS LIKE THIS:

  ,
  {
    name: "My New Project",
    description: "What the project does.",
    link: "https://example.com"
  }

  */

];


const container =
  document.getElementById("projects");


projects.forEach((project, index) => {

  const card =
    document.createElement("article");

  card.className = "card";


  card.innerHTML = `

    <span class="number">
      ${String(index + 1).padStart(2, "0")}
    </span>

    <h2>
      ${project.name}
    </h2>

    <p>
      ${project.description}
    </p>

    <a
      class="card-link"
      href="${project.link}">
      View project →
    </a>

  `;


  container.appendChild(card);

});

</script>


</body>
</html>
