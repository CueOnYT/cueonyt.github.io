<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CueMoo — Stats</title>

  <!-- UMAMI ANALYTICS -->
  <script
    defer
    src="https://cloud.umami.is/script.js"
    data-website-id="f21ba53f-9919-4d9e-bebc-53fbb1c114e0">
  </script>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

  <a class="logo" href="index.html">
    CueMoo
  </a>

  <nav>

    <a href="index.html">
      About
    </a>

    <a href="projects.html">
      Projects
    </a>

    <a href="contact.html">
      Contact
    </a>

    <a class="active" href="stats.html">
      Stats
    </a>

  </nav>

</header>


<main>

  <section class="section-heading">

    <p class="eyebrow">
      PUBLIC STATS
    </p>

    <h1>
      Website activity.
    </h1>

    <p class="muted">
      Real website analytics powered by Umami.
    </p>

  </section>


  <section class="stats-grid">


    <div class="stat">

      <span>
        Online now
      </span>

      <strong id="online">
        —
      </strong>

    </div>


    <div class="stat">

      <span>
        Today
      </span>

      <strong id="today">
        —
      </strong>

    </div>


    <div class="stat">

      <span>
        This week
      </span>

      <strong id="week">
        —
      </strong>

    </div>


    <div class="stat">

      <span>
        This month
      </span>

      <strong id="month">
        —
      </strong>

    </div>


    <div class="stat">

      <span>
        This year
      </span>

      <strong id="year">
        —
      </strong>

    </div>


    <div class="stat">

      <span>
        All time
      </span>

      <strong id="alltime">
        —
      </strong>

    </div>


  </section>


  <div class="stats-status">

    <span class="status-dot"></span>

    <span>
      Analytics connected
    </span>

  </div>


  <p class="stats-note">
    Online users represents unique visitors detected by Umami
    within the last 5 minutes.
  </p>


</main>


<footer>
  CueMoo
</footer>


</body>
</html>
